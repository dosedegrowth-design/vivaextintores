# Site provisório da VIVA no GitHub Pages.
#
# Por que aqui e não na Vercel: nesta conta da Vercel só o alias de produção
# de um projeto é público, e a credencial que publica não cria projeto.
# O Pages dá um hostname limpo, HTTPS, sem login — e sem tocar no site que
# está no ar em vivaextintores.com.br (branch main, Vercel).
#
# Fonte: branch novo-site. Cada push publica de novo.
name: Site provisório (GitHub Pages)

on:
  push:
    branches: [novo-site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # cria o site do Pages se ainda não existir e devolve o base_path
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm install --no-audit --no-fund

      # prebuild baixa as fotos do repositório do painel e trata todas
      - run: npm run build
        env:
          VIVA_EXPORT: "1"
          VIVA_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
