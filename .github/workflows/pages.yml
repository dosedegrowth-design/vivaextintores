# Site provisório da VIVA no GitHub Pages.
#
# Por que aqui e não na Vercel: nesta conta da Vercel só o alias de produção
# de um projeto é público, e a credencial que publica não cria projeto.
# O Pages dá um hostname limpo, HTTPS, sem login — e sem tocar no site que
# está no ar em vivaextintores.com.br (branch main, Vercel).
#
# Modo "branch": o build gera out/ e o resultado é empurrado para gh-pages.
# (Criar o site do Pages pela API exige admin, que o GITHUB_TOKEN não tem;
# publicar numa branch, não.)
#
# Fonte: branch novo-site. Cada push publica de novo.
name: Site provisório (GitHub Pages)

on:
  push:
    branches: [novo-site]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      # prebuild baixa as fotos do repositório do painel e trata todas
      - run: npm run build
        env:
          VIVA_EXPORT: "1"
          VIVA_BASE_PATH: /vivaextintores
          NEXT_PUBLIC_BASE_PATH: /vivaextintores

      # Jekyll ignoraria _next/; as fotos originais não são servidas
      - run: |
          touch out/.nojekyll
          rm -rf out/photos

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "site provisório: ${{ github.sha }}"
